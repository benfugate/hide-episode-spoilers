version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: daily
    # Keep PR noise low
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope

  # Replaces the old scheduled base-image check. Actions crons are disabled
  # after 60 days of repository inactivity; Dependabot schedules are not.
  # Keeps the :latest tag and updates the pinned digest underneath it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    allow:
      - dependency-name: "tautulli/tautulli"
